<!DOCTYPE html>
<html lang="en">
<head>
  <title>Tally Timer</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      font-size: 16px;
      padding: 0;
      margin: 0;
      text-align: center;
    }

    body {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
      grid-template-rows: repeat(2, minmax(0, 1fr)) auto;
      gap: 1rem;
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      max-width: 500px;
      padding: 1rem;
      align-items: center;
    }

    .timer-section {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 1rem;
      grid-column: 1 / -1;
      grid-row: 1 / 3;
      align-self: center;
      min-height: 0;
      max-height: 100%;
    }
    #count, #macro, #micro {
      font-variant-numeric: tabular-nums;
    }

    #macro {
      display: inline-block;
    }

    .time {
      display: flex;
      flex-direction: column;
      align-items: center;
      grid-column: 1;
      font-size: clamp(1rem, 35vw, 200px);
      line-height: 1;
      font-weight: bold;
    }

    .time.macro {
      grid-row: 1;
      align-self: end;
      margin-bottom: 1rem;
    }

    .time.micro {
      grid-row: 2;
      align-self: start;
    }

    .time-label {
      font-size: 0.12em;
      color: #d1d1d6;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    #count {
      grid-column: 2;
      grid-row: 1 / 3;
      align-self: stretch;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      grid-auto-rows: minmax(0, 1fr);
      align-content: stretch;
      justify-content: center;
      gap: 8px;
      min-height: 0;
      overflow-y: auto;
      padding: 0.2rem;
    }

    .tally-mark {
      width: 100%;
      height: 100%;
      background: #d1d1d6;
    }

    .tally-mark.counted {
      background: #007aff;
    }

    .bottom-form {
      display: contents;
    }

    input[value="count"] {
      grid-row: 3;
    }

    input[value="reset"] {
      grid-row: 3;
    }
    input[type="submit"] {
      --button-background: #f2f2f7;
      --button-color: #007aff;
      --button-hover-background: #e5e5ea;
      --button-active-background: #d1d1d6;
      --button-focus: rgba(0, 122, 255, 0.45);
      --button-shadow: rgba(0, 122, 255, 0.2);

      appearance: none;
      background: var(--button-background);
      color: var(--button-color);
      width: 100%;
      padding-top: 18px;
      padding-bottom: 18px;
      border: none;
      border-radius: 16px;
      font-size: 20px;
      font-weight: 600;
      transition: background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
      margin-bottom: 0;
      margin-top: 1rem;
      text-transform: capitalize;
      cursor: pointer;
    }

    input[type="submit"]:hover {
      background: var(--button-hover-background);
    }

    input[type="submit"]:active {
      background: var(--button-active-background);
      transform: scale(0.98);
    }

    input[type="submit"]:focus-visible {
      outline: 3px solid var(--button-focus);
      outline-offset: 2px;
    }

    input[type="submit"].primary {
      --button-background: #007aff;
      --button-color: #ffffff;
      --button-hover-background: #0071eb;
      --button-active-background: #0062cc;

      box-shadow: 0 3px 8px var(--button-shadow);
    }

    @media (prefers-reduced-motion: reduce) {
      input[type="submit"] {
        transition: none;
      }

      input[type="submit"]:active {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="timer-section">
    <div class="time macro">
      <span id="macro">00</span><span class="time-label">minutes</span>
    </div>
    <div class="time micro">
      <span id="micro">00</span><span class="time-label">seconds</span>
    </div>

    <div id="count" role="img" aria-label="0 tallies"></div>
  </div>

  <form class="bottom-form">
    <input type="submit" value="count" class="primary" />
    <input type="submit" value="reset" />
  </form>

  <script>
    const countEl = document.getElementById("count");
    const macroEl = document.getElementById("macro");
    const microEl = document.getElementById("micro");
    const macroLabelEl = document.querySelector(".time.macro .time-label");
    const microLabelEl = document.querySelector(".time.micro .time-label");
    const timeUnits = [
      { label: "years", duration: 365.25 * 24 * 60 * 60 * 1000 },
      { label: "weeks", duration: 7 * 24 * 60 * 60 * 1000 },
      { label: "days", duration: 24 * 60 * 60 * 1000 },
      { label: "hours", duration: 60 * 60 * 1000 },
      { label: "minutes", duration: 60 * 1000 },
      { label: "seconds", duration: 1000 }
    ];
    const formEl = document.querySelector("form");

    let lastZero = Number(localStorage.getItem("lastZero")) || Date.now();
    let count = Number(localStorage.getItem("count")) || 0;
    renderCount();
    localStorage.setItem("lastZero", lastZero);

    let previousMacro = null;

    formEl.addEventListener("submit", function(event) {
      event.preventDefault();
      const action = event.submitter.value;
      lastZero = Date.now();
      localStorage.setItem("lastZero", lastZero);

      if (action === "count") {
        count += 1;
        renderCount();
        pulse(countEl);
      } else {
        count = 0;
        renderCount();
      }

      localStorage.setItem("count", count);
    });

    function renderCount() {
      const slots = Math.max(5, Math.ceil(count / 5) * 5);
      countEl.replaceChildren(...Array.from({ length: slots }, (_, index) => {
        const mark = document.createElement("span");
        mark.className = index < count ? "tally-mark counted" : "tally-mark";
        mark.setAttribute("aria-hidden", "true");
        return mark;
      }));
      countEl.setAttribute("aria-label", `${count} tallies`);
    }

    function pulse(element) {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      element.animate([
        { transform: 'translateY(0)', opacity: 1 },
        { transform: 'translateY(-3px)', opacity: 0.8, offset: 0.35 },
        { transform: 'translateY(0)', opacity: 1 }
      ], {
        duration: 420,
        easing: 'cubic-bezier(0.22, 1, 0.36, 1)'
      });
    }

    function updateTimer() {
      const ms = Date.now() - lastZero;

      let remaining = ms;
      const values = timeUnits.map(({ duration }) => {
        const value = Math.floor(remaining / duration);
        remaining %= duration;
        return value;
      });
      const firstNonzero = values.findIndex(value => value > 0);
      const macroIndex = firstNonzero === -1 || firstNonzero > 4 ? 4 : firstNonzero;
      const microIndex = macroIndex + 1;
      const currentMacro = `${values[macroIndex]} ${timeUnits[macroIndex].label}`;

      if (previousMacro !== null && currentMacro !== previousMacro) pulse(macroEl);
      previousMacro = currentMacro;

      macroEl.innerText = String(values[macroIndex]).padStart(2, '0');
      macroLabelEl.innerText = timeUnits[macroIndex].label;
      microEl.innerText = String(values[microIndex]).padStart(2, '0');
      microLabelEl.innerText = timeUnits[microIndex].label;

      requestAnimationFrame(updateTimer);
    };

    requestAnimationFrame(updateTimer);
  </script>
</body>
</html>
